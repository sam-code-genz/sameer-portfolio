<svg width="800" height="1200" viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Midnight Ledger — Poster">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(150.4 0.5 0.5)">
      <stop offset="0%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#1b1430" />
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="75%">
      <stop offset="55%" stop-color="black" stop-opacity="0" />
      <stop offset="100%" stop-color="black" stop-opacity="0.6" />
    </radialGradient>
    <filter id="grain">
